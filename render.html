<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<title>Menkeu Suahasil: APBN Defisit Rp 240,1 Triliun pada Agustus 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Unbounded:wght@800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<script src="/matter.min.js" onerror="console.warn('Matter.js lokal gagal dimuat, fallback online aktif')"></script>
<style>
:root { --sub-h: 150px; }
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; background:#05070D; overflow:hidden;
  font-family:'Bricolage Grotesque',system-ui,sans-serif; }

#stage { position:absolute; top:50%; left:50%; width:1920px; height:1080px;
  transform:translate(-50%,-50%); transform-origin:center center;
  overflow:hidden; background:#05070D; }

/* --- scene ------------------------------------------------------------ */
.sc { position:absolute; inset:0; opacity:0; visibility:hidden;
  will-change:opacity,transform; }
.sc svg { width:100%; height:100%; display:block; }
.sc.aktif { opacity:1; visibility:visible; }
/* Gerak kamera dijalankan CSS (compositor thread) supaya tetap mulus
   walau thread JS sibuk menggambar isi scene. */
.sc.aktif svg { animation:var(--cam) var(--dur) linear 1 forwards;
  transform-origin:center center; }

/* Tint per babak: menyatukan warna antar-scene supaya tidak meloncat. */
.sc::after { content:''; position:absolute; inset:0; pointer-events:none;
  background:var(--grade); mix-blend-mode:soft-light; }

/* --- lapis suasana global -------------------------------------------- */
/* Semua lapis ini statis (tanpa filter blur real-time) — pelajaran dari
   percobaan sebelumnya: blur pada banyak layer besar membekukan browser. */
#vignette { position:absolute; inset:0; pointer-events:none; z-index:20;
  background:
    radial-gradient(ellipse 78% 68% at 50% 46%, transparent 42%, rgba(0,0,0,.55) 100%),
    linear-gradient(to bottom, rgba(0,0,0,.30) 0%, transparent 18%, transparent 76%, rgba(0,0,0,.48) 100%);
}
#haze { position:absolute; inset:0; pointer-events:none; z-index:19;
  background:linear-gradient(to bottom,
    transparent 0%, rgba(148,176,214,.055) 38%, rgba(148,176,214,.085) 54%, transparent 72%);
}
/* Grain: satu SVG noise di-tile. Memberi rasa "kertas kolase" dan
   menyamarkan banding pada gradient besar. */
#grain { position:absolute; inset:0; pointer-events:none; z-index:21;
  opacity:.055; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.6'/></svg>");
  background-size:340px 340px; }

/* Flash cut: penanda benturan/kejutan, dipicu dari JS. */
#flash { position:absolute; inset:0; pointer-events:none; z-index:30;
  background:#fff; opacity:0; }
#flash.tembak { animation:flashOut .28s ease-out 1; }
@keyframes flashOut { from { opacity:.82; } to { opacity:0; } }


@keyframes camPush     { from { transform: scale(1.00) translate(0,0); }      to { transform: scale(1.14) translate(0,-1.5%); } }
@keyframes camPullback { from { transform: scale(1.16) translate(0,1%); }     to { transform: scale(1.00) translate(0,0); } }
@keyframes camPanRight { from { transform: scale(1.10) translate(3.5%,0); }   to { transform: scale(1.10) translate(-3.5%,0); } }
@keyframes camPanLeft  { from { transform: scale(1.10) translate(-3.5%,0); }  to { transform: scale(1.10) translate(3.5%,0); } }
@keyframes camCrane    { from { transform: scale(1.14) translate(0,-4%); }    to { transform: scale(1.04) translate(0,1.5%); } }
@keyframes camDutch    { from { transform: scale(1.10) rotate(-1.6deg); }     to { transform: scale(1.14) rotate(1.6deg); } }


/* --- subtitle --------------------------------------------------------- */
#sub { position:absolute; left:50%; bottom:28px; transform:translateX(-50%);
  width:1560px; max-width:1560px; z-index:25; text-align:center;
  padding:14px 34px; border-radius:14px;
  background:rgba(8,14,26,.90); border:1.2px solid rgba(255,255,255,.18);
  box-shadow:0 12px 40px rgba(0,0,0,.5);
  font-size:30px; line-height:1.34; font-weight:800; color:#F8FAFC;
  text-wrap:balance; }
#sub:empty { display:none; }
#sub .hl { display:inline-block; padding:2px 14px; margin:0 4px;
  border-radius:7px; font-weight:900; color:#FFF;
  background:linear-gradient(135deg, #EA580C 0%, #F97316 100%);
  box-shadow:0 2px 12px rgba(234,88,12,.5), inset 0 1px 0 rgba(255,255,255,.15);
  text-shadow:0 1px 3px rgba(0,0,0,.4); }

#mulai { position:absolute; inset:0; z-index:60; display:flex;
  align-items:center; justify-content:center; background:rgba(5,7,13,.92);
  color:#F8FAFC; font-size:26px; font-weight:800; cursor:pointer;
  letter-spacing:.3px; }
#mulai.off { display:none; }
body.studio-mode #mulai { display:none !important; }
</style></head>
<body>
<div id="stage">
  <div class="sc" id="sc01" data-cam="camPush" style="--dur:8.773s;--grade:rgba(56,130,246,.10)"><svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice"><defs>
  <!-- Sinar sorot lampu 45 derajat -->
  <linearGradient id="sorotLampu1" x1="1" y1="0" x2="0.2" y2="1">
    <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.32" />
    <stop offset="45%" stop-color="#FEF08A" stop-opacity="0.12" />
    <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0" />
  </linearGradient>

  <!-- Pendar flash kamera pers -->
  <radialGradient id="flashGlow1" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
    <stop offset="35%" stop-color="#93C5FD" stop-opacity="0.6" />
    <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
  </radialGradient>

  <!-- Gradasi kayu dinding latar -->
  <linearGradient id="panelKayu1" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#94A3B8" />
    <stop offset="100%" stop-color="#64748B" />
  </linearGradient>

  <!-- Bayangan lembut map anggaran -->
  <linearGradient id="mapShade1" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#991B1B" />
    <stop offset="100%" stop-color="#DC2626" />
  </linearGradient>

  <!-- Bayangan dinamis lipatan sampul (kedalaman 3D lipatan kertas tanpa layer baru) -->
  <filter id="bayanganLipatanSampul" x="-40%" y="-30%" width="180%" height="160%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur">
      <animate
        attributeName="stdDeviation"
        values="2; 16; 14; 8"
        keyTimes="0; 0.52; 0.8; 1"
        dur="0.5s"
        begin="0.8s"
        fill="freeze"
      />
    </feGaussianBlur>
    <feOffset dx="4" dy="8" result="offset">
      <animate
        attributeName="dx"
        values="2; 22; -16; -20"
        keyTimes="0; 0.52; 0.8; 1"
        dur="0.5s"
        begin="0.8s"
        fill="freeze"
      />
      <animate
        attributeName="dy"
        values="4; 20; 14; 8"
        keyTimes="0; 0.52; 0.8; 1"
        dur="0.5s"
        begin="0.8s"
        fill="freeze"
      />
    </feOffset>
    <feComponentTransfer in="offset" result="shadow">
      <feFuncA type="linear" slope="0.3">
        <animate
          attributeName="slope"
          values="0.25; 0.65; 0.5; 0.35"
          keyTimes="0; 0.52; 0.8; 1"
          dur="0.5s"
          begin="0.8s"
          fill="freeze"
        />
      </feFuncA>
    </feComponentTransfer>
    <feMerge>
      <feMergeNode in="shadow" />
      <feMergeNode in="SourceGraphic" />
    </feMerge>
  </filter>
</defs>

<!-- ================= 1. LATAR BELAKANG ================= -->
<g id="latarBelakang">
  <!-- Dinding ruang pers abu-abu kantor -->
  <rect x="0" y="0" width="1920" height="1080" fill="#E2E8F0" />

  <!-- Dinding panel akustik bergaris vertikal khas Kemenkeu -->
  <g id="panelAkustikDinding" opacity="0.65">
    <rect x="120" y="80" width="1680" height="740" rx="16" fill="url(#panelKayu1)" stroke="#0F172A" stroke-width="8" />
    <!-- Kisi panel vertikal kayu abu-abu -->
    <line x1="260" y1="80" x2="260" y2="820" stroke="#475569" stroke-width="6" />
    <line x1="400" y1="80" x2="400" y2="820" stroke="#475569" stroke-width="6" />
    <line x1="540" y1="80" x2="540" y2="820" stroke="#475569" stroke-width="6" />
    <line x1="680" y1="80" x2="680" y2="820" stroke="#475569" stroke-width="6" />
    <line x1="820" y1="80" x2="820" y2="820" stroke="#475569" stroke-width="6" />
    <line x1="960" y1="80" x2="960" y2="820" stroke="#475569" stroke-width="6" />
    <line x1="1100" y1="80" x2="1100" y2="820" stroke="#475569" stroke-width="6" />
    <line x1="1240" y1="80" x2="1240" y2="820" stroke="#475569" stroke-width="6" />
    <line x1="1380" y1="80" x2="1380" y2="820" stroke="#475569" stroke-width="6" />
    <line x1="1520" y1="80" x2="1520" y2="820" stroke="#475569" stroke-width="6" />
    <line x1="1660" y1="80" x2="1660" y2="820" stroke="#475569" stroke-width="6" />
  </g>

  <!-- Papan lambang resmi Kemenkeu latar belakang -->
  <g id="plakatKemenkeu">
    <rect x="710" y="140" width="500" height="150" rx="14" fill="#1E293B" stroke="#0F172A" stroke-width="7" />
    <!-- Garis emas aksen resmi -->
    <rect x="725" y="155" width="470" height="120" rx="8" fill="none" stroke="#F59E0B" stroke-width="3" stroke-dasharray="8 6" />
    <!-- Lambang padi & kapas geometri sederhana -->
    <circle cx="960" cy="190" r="18" fill="#F59E0B" stroke="#0F172A" stroke-width="4" />
    <path d="M 945 190 Q 960 170 975 190 Q 960 210 945 190 Z" fill="#FEF08A" stroke="#0F172A" stroke-width="3" />
    <!-- Teks Ruang Konferensi Pers Kemenkeu -->
    <text x="960" y="232" fill="#F8FAFC" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" letter-spacing="4" text-anchor="middle">KEMENTERIAN KEUANGAN</text>
    <text x="960" y="254" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" letter-spacing="3" text-anchor="middle">REPUBLIK INDONESIA</text>
  </g>
</g>

<!-- ================= 2. PENCAHAYAAN STUDIO & DEBU UDARA ================= -->
<g id="pencahayaanAtmosfer">
  <!-- Berkas sinar sorot lampu pers sudut 45 derajat dari kanan atas -->
  <polygon points="1860,-40 1320,-40 520,1080 1480,1080" fill="url(#sorotLampu1)" />

  <!-- Partikel debu tenang melayang lambat di berkas cahaya -->
  <g id="partikelDebuMelayang">
    <circle cx="1280" cy="340" r="3.5" fill="#FEF08A" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="0,0; 15,-30; 0,0" dur="4.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="1190" cy="460" r="2.5" fill="#FFFFFF" opacity="0.6">
      <animateTransform attributeName="transform" type="translate" values="0,0; -12,-20; 0,0" dur="3.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="1060" cy="390" r="3" fill="#FEF08A" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" values="0,0; 10,-25; 0,0" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="940" cy="480" r="2" fill="#FEF08A" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0,0; -8,-15; 0,0" dur="4.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="1340" cy="530" r="3" fill="#FFFFFF" opacity="0.75">
      <animateTransform attributeName="transform" type="translate" values="0,0; 14,-28; 0,0" dur="3.6s" repeatCount="indefinite" />
    </circle>
    <circle cx="850" cy="420" r="2" fill="#FEF08A" opacity="0.6">
      <animateTransform attributeName="transform" type="translate" values="0,0; 6,-18; 0,0" dur="4.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="1120" cy="620" r="3.5" fill="#FEF08A" opacity="0.65">
      <animateTransform attributeName="transform" type="translate" values="0,0; -10,-24; 0,0" dur="4.1s" repeatCount="indefinite" />
    </circle>
  </g>
</g>

<!-- ================= 3. SUBJEK UTAMA: SUAHASIL NAZARA & MAP ================= -->
<g id="suahasilNazara">
  <!-- Gerak Hidup: Dada bernapas halus teratur -->
  <animateTransform
    attributeName="transform"
    type="translate"
    values="0 0; 0 -3.5; 0 0"
    keyTimes="0; 0.5; 1"
    keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"
    calcMode="spline"
    dur="3.5s"
    repeatCount="indefinite"
  />

  <!-- Tubuh & Kemeja Putih Rapi (y=470..820) -->
  <g id="badanDanPakaian">
    <!-- Leher -->
    <rect x="925" y="440" width="70" height="60" rx="8" fill="#F8C79D" stroke="#0F172A" stroke-width="6" />
    <!-- Bayangan leher di kerah -->
    <path d="M 925 470 Q 960 490 995 470 L 995 490 L 925 490 Z" fill="#E0A97E" />

    <!-- Bahu & Badan Kemeja Putih -->
    <path d="M 780 500 L 920 480 L 1000 480 L 1140 500 L 1160 840 L 760 840 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="8" stroke-linejoin="round" />

    <!-- Sambungan pangkal bahu kanan tetap kokoh saat lengan menjangkau buka map -->
    <path d="M 1040 500 L 1140 500 L 1160 620 L 1070 610 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="8" stroke-linejoin="round" />

    <!-- Lipatan saku kemeja & kancing tengah -->
    <line x1="960" y1="530" x2="960" y2="840" stroke="#CBD5E1" stroke-width="5" />
    <circle cx="960" cy="570" r="4" fill="#0F172A" />
    <circle cx="960" cy="640" r="4" fill="#0F172A" />
    <circle cx="960" cy="710" r="4" fill="#0F172A" />
    <circle cx="960" cy="780" r="4" fill="#0F172A" />

    <!-- Kerah Kemeja Putih Tegap -->
    <polygon points="920,475 960,535 940,540 895,490" fill="#F8FAFC" stroke="#0F172A" stroke-width="6" stroke-linejoin="round" />
    <polygon points="1000,475 960,535 980,540 1025,490" fill="#F8FAFC" stroke="#0F172A" stroke-width="6" stroke-linejoin="round" />

    <!-- Lencana Pin Kemenkeu di dada kiri -->
    <circle cx="865" cy="550" r="9" fill="#F59E0B" stroke="#0F172A" stroke-width="3" />
    <circle cx="865" cy="550" r="4" fill="#1E3A8A" />
  </g>

  <!-- Kepala & Wajah Suahasil Nazara (y=320..460) -->
  <g id="kepalaSuahasil">
    <!-- Telinga Kiri & Kanan -->
    <rect x="888" y="380" width="22" height="40" rx="10" fill="#F8C79D" stroke="#0F172A" stroke-width="6" />
    <rect x="1010" y="380" width="22" height="40" rx="10" fill="#F8C79D" stroke="#0F172A" stroke-width="6" />

    <!-- Bentuk Wajah Kokoh -->
    <rect x="900" y="335" width="120" height="125" rx="28" fill="#FBD5B5" stroke="#0F172A" stroke-width="8" stroke-linejoin="round" />

    <!-- Rambut Rapi Berbelah Samping -->
    <path d="M 895 365 C 895 320, 930 305, 960 305 C 1000 305, 1030 320, 1030 365 C 1015 345, 985 340, 960 340 C 930 340, 910 350, 895 365 Z" fill="#1E293B" stroke="#0F172A" stroke-width="7" stroke-linejoin="round" />
    <!-- Sentuhan Uban Tipis Elegan di Pelipis -->
    <path d="M 900 360 Q 910 345 925 345" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 1022 360 Q 1012 345 998 345" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Alis Karakteristik Tegas & Tenang -->
    <line x1="922" y1="375" x2="948" y2="373" stroke="#0F172A" stroke-width="6" stroke-linecap="round" />
    <line x1="972" y1="373" x2="998" y2="375" stroke="#0F172A" stroke-width="6" stroke-linecap="round" />

    <!-- Sorot Mata Mantap Menatap Pers -->
    <g id="mataSuahasil">
      <!-- Tatapan mata fokus melirik map terbuka pada 0.8s, lalu seketika terkunci mantap ke arah pers pada 1.3s (freeze) -->
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0; 0 0; -1.5 2.5; 0 0; 0 0"
        keyTimes="0; 0.44; 0.58; 0.72; 1"
        keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.16 1 0.3 1; 0.4 0 0.2 1"
        calcMode="spline"
        dur="1.8s"
        fill="freeze"
      />
      <ellipse cx="935" cy="388" rx="7" ry="5.5" fill="#FFFFFF" stroke="#0F172A" stroke-width="4" />
      <circle cx="936" cy="388" r="3.5" fill="#0F172A" />
      <circle cx="938" cy="386" r="1.2" fill="#FFFFFF" />

      <ellipse cx="985" cy="388" rx="7" ry="5.5" fill="#FFFFFF" stroke="#0F172A" stroke-width="4" />
      <circle cx="984" cy="388" r="3.5" fill="#0F172A" />
      <circle cx="986" cy="386" r="1.2" fill="#FFFFFF" />
    </g>

    <!-- Kacamata Bingkai Persegi Khas -->
    <g id="kacamataSuahasil">
      <!-- Bingkai lensa kiri -->
      <rect x="916" y="375" width="36" height="26" rx="6" fill="none" stroke="#0F172A" stroke-width="5" />
      <!-- Bingkai lensa kanan -->
      <rect x="968" y="375" width="36" height="26" rx="6" fill="none" stroke="#0F172A" stroke-width="5" />
      <!-- Jembatan kacamata -->
      <line x1="952" y1="385" x2="968" y2="385" stroke="#0F172A" stroke-width="5" />
      <!-- Tangkai pelipis -->
      <line x1="916" y1="384" x2="898" y2="382" stroke="#0F172A" stroke-width="4" />
      <line x1="1004" y1="384" x2="1022" y2="382" stroke="#0F172A" stroke-width="4" />
      <!-- Pantulan cahaya kaca miring 45 derajat -->
      <polygon points="922,397 934,379 938,379 926,397" fill="#FFFFFF" opacity="0.45" />
      <polygon points="974,397 986,379 990,379 978,397" fill="#FFFFFF" opacity="0.45" />
    </g>

    <!-- Hidung Sederhana -->
    <path d="M 960 388 L 962 408 L 954 411" stroke="#0F172A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Garis Bibir Tegas & Mantap -->
    <line x1="945" y1="430" x2="975" y2="430" stroke="#0F172A" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Lengan Kiri Menopang Punggung Map -->
  <g id="lenganKiri">
    <path d="M 800 520 L 760 670 L 840 685 L 870 560 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="8" stroke-linejoin="round" />
    <!-- Telapak tangan kiri menggenggam engsel map -->
    <rect x="830" y="650" width="38" height="42" rx="10" fill="#F8C79D" stroke="#0F172A" stroke-width="6" />
    <path d="M 845 650 L 845 680" stroke="#0F172A" stroke-width="4" stroke-linecap="round" />
    <path d="M 857" y1="650" x2="857" y2="682" stroke="#0F172A" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- MAP ANGGARAN MERAH & LEMBARAN PERTAMA ISI DEFISIT -->
  <!-- Diletakkan hierarkis di dalam tubuh, persis dipegang kedua tangan -->
  <g id="mapAnggaranMerah">
    <!-- Punggung dasar/Alas map belakang -->
    <rect x="850" y="520" width="260" height="310" rx="12" fill="url(#mapShade1)" stroke="#0F172A" stroke-width="8" />

    <!-- Lembaran Dokumen APBN Pertama Tercetak Tebal Angka Defisit -->
    <g id="lembarDokumenAPBN">
      <!-- Muncul bertahap (t = 0.8s..1.3s) saat sampul membuka, lalu menahan tampilan penuh -->
      <animate
        attributeName="opacity"
        values="0; 0.25; 0.7; 1"
        keyTimes="0; 0.35; 0.7; 1"
        dur="0.5s"
        begin="0.8s"
        fill="freeze"
      />
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 8; 0 0"
        dur="0.5s"
        begin="0.8s"
        fill="freeze"
        calcMode="spline"
        keySplines="0.16 1 0.3 1"
      />

      <rect x="862" y="530" width="236" height="288" rx="8" fill="#F8FAFC" stroke="#0F172A" stroke-width="6" />

      <!-- Kop Dokumen Resmi -->
      <line x1="880" y1="555" x2="1080" y2="555" stroke="#CBD5E1" stroke-width="3" />
      <rect x="880" y="565" width="120" height="12" rx="3" fill="#64748B" />
      <rect x="880" y="583" width="70" height="8" rx="2" fill="#94A3B8" />

      <!-- Kotak Indikator Merah Defisit -->
      <rect x="876" y="615" width="208" height="110" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="4" />
      
      <!-- Tanda Peringatan Minus Grafis Merah -->
      <circle cx="905" cy="642" r="12" fill="#DC2626" />
      <line x1="897" y1="642" x2="913" y2="642" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />

      <!-- Label Status -->
      <text x="926" y="647" fill="#DC2626" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="13" letter-spacing="1.5">DEFISIT APBN</text>

const $ = s => document.querySelector(s);
const el = id => document.getElementById(id);
const scEls = [...document.querySelectorAll('.sc')];
const subEl = $('#sub');
const mulus = x => x*x*(3-2*x);

/* =========================================================================
   2D PHYSICS & RIGGING TOOLKIT (Fisika Panggung)
   ========================================================================= */
const fisika = {
  // 1. Spring Physics (Framer Motion / React Spring style)
  pegas(t, freq = 3.2, redaman = 0.72) {
    if (t <= 0) return 0;
    const w = freq * Math.PI * 2;
    const decay = Math.exp(-redaman * w * t);
    const wDamped = w * Math.sqrt(Math.max(0, 1 - redaman * redaman));
    return 1 - decay * Math.cos(wDamped * t);
  },

  // 2. Inersia langkah kaki & ayunan tubuh alami
  langkah(t, speed = 6.0, bobot = 4.5) {
    const s = Math.sin(t * speed);
    return {
      ayun: s,
      hentak: -Math.abs(s) * bobot,
    };
  },

  // 3. Rigid-body Surface Contact (Anti-melayang & Anti-tembus lantai)
  tumpu(yObj, yLantai = 850) {
    return Math.min(yObj, yLantai);
  },

  // 4. Rigging Constraint (Kunci anak ke koordinat induk: anti tangan copot/koper lepas)
  ikat(anakEl, xInduk, yInduk, offsetX = 0, offsetY = 0, rotasi = 0, cx = 0, cy = 0) {
    if (!anakEl) return;
    const x = Number(xInduk || 0) + Number(offsetX || 0);
    const y = Number(yInduk || 0) + Number(offsetY || 0);
    const r = rotasi ? ((cx || cy) ? ` rotate(${rotasi} ${cx} ${cy})` : ` rotate(${rotasi})`) : '';
    anakEl.setAttribute('transform', `translate(${x.toFixed(1)}, ${y.toFixed(1)})${r}`);
  },

  // 5. In-Place Rotation (Anti mengorbit liar)
  putar(el, deg, cx, cy) {
    if (!el) return;
    el.setAttribute('transform', `rotate(${Number(deg).toFixed(1)} ${cx} ${cy})`);
  },

  // 6. Rolling Without Slipping (Roda menggelinding presisi)
  gelinding(dx, radius = 40) {
    return (dx / (radius * 2 * Math.PI)) * 360;
  }
};
window.fisika = fisika;

/* Panggung berukuran tetap 1920x1080 lalu diskalakan ke jendela. Semua
   koordinat SVG jadi bisa dipakai apa adanya tanpa perhitungan responsif. */
let skala = 1;
function pasang() {
  skala = Math.min(innerWidth/1920, innerHeight/1080);
  $('#stage').style.transform = `translate(-50%,-50%) scale(${skala})`;
}
addEventListener('resize', pasang); pasang();

let idx = -1, jeda = false, mulaiScene = 0, audioEl = null, ambientEl = null, sceneLoopEl = null, bgmAudioEl = null, sudahMulai = false;

function putarBgm() {
  if (MODE === 'render' || bgmAudioEl) return;
  try {
    const bFile = BGM_CFG.file || 'bgm_asking_questions.wav';
    bgmAudioEl = new Audio('audio/sfx/' + bFile);
    bgmAudioEl.loop = true;
    bgmAudioEl.volume = Math.max(0, Math.min(1, BGM_CFG.volume || 0.22));
    bgmAudioEl.play().catch(() => {});
  } catch (e) {}
}

function putarAmbient() {
  if (MODE === 'render' || ambientEl) return;
  try {
    ambientEl = new Audio('audio/sfx/bgm_investigative_drone.wav');
    ambientEl.loop = true;
    ambientEl.volume = 0.12;
    ambientEl.play().catch(() => {});
  } catch (e) {}
}

function flash() {
  const f = $('#flash');
  f.classList.remove('tembak'); void f.offsetWidth; f.classList.add('tembak');
}

/* Subtitle disorot dengan mencocokkan kata kunci dari storyboard.
   Kalau frasa utuh tidak persis sama, cari kata kunci terpanjangnya. */
function tulisSub(teks, sorot) {
  if (!teks) { subEl.innerHTML = ''; return; }
  let html = teks.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const kunci = (sorot||'').trim();
  if (kunci) {
    const re = new RegExp('(' + kunci.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'i');
    if (re.test(html)) {
      html = html.replace(re, '<span class="hl">$1</span>');
    } else {
      const kata2 = kunci.split(/\s+/).filter(w => w.length >= 4);
      for (const w of kata2) {
        const rew = new RegExp('\\b(' + w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')\\b', 'i');
        if (rew.test(html)) {
          html = html.replace(rew, '<span class="hl">$1</span>');
          break;
        }
      }
    }
  }
  subEl.innerHTML = html;
}

function keScene(n, mainkanAudio = true) {
  if (n < 0) n = 0;
  if (n >= scEls.length) n = scEls.length - 1;
  const lama = idx; idx = n; mulaiScene = performance.now();

  scEls.forEach((e,i) => {
    if (i === n) {
      e.style.setProperty('--cam', 'none'); void e.offsetWidth;   // reset animasi kamera
      e.style.setProperty('--cam', e.dataset.cam);
      e.classList.add('aktif');
    } else e.classList.remove('aktif');
  });

  const m = META[n];
  tulisSub(m.chunks?.[0]?.text || '', m.sorot);
  if (lama !== -1 && (n - lama === 1)) flash();

  if (!mainkanAudio) return;
  if (MODE === 'render') return;            // saat render, audio digabung ffmpeg

  putarBgm();
  putarAmbient();

  if (m.audio) {                            // mp3 hasil edge-tts
    if (audioEl) { audioEl.pause(); audioEl.src=''; }
    audioEl = new Audio('audio/' + m.audio);
    audioEl.play().catch(()=>{});
  } else if ('speechSynthesis' in window) {  // preview cepat tanpa file
    speechSynthesis.cancel();
    const kalimat = (m.chunks||[]).map(c=>c.text).join(' ').replace(/[.!?]+$/,'');
    if (kalimat) {
      const u = new SpeechSynthesisUtterance(kalimat);
      u.lang='id-ID'; u.rate=1.12; u.pitch=0.92;
      const v = speechSynthesis.getVoices().find(v=>/^id/i.test(v.lang));
      if (v) u.voice = v;
      speechSynthesis.speak(u);
    }
  }

  // Layer Continuous Scene Ambient Loop (Durasi Penuh Scene)
  if (sceneLoopEl) { sceneLoopEl.pause(); sceneLoopEl = null; }
  if (m.loop && m.loop.file) {
    sceneLoopEl = new Audio('audio/sfx/' + m.loop.file);
    sceneLoopEl.loop = true;
    sceneLoopEl.volume = Math.max(0, Math.min(1, m.loop.volume || 0.20));
    sceneLoopEl.play().catch(()=>{});
  }

  // Layer SFX Foley & Transisi Panggung (3-Layer Action Stacks)
  if (m.sfx && Array.isArray(m.sfx)) {
    m.sfx.forEach(cue => {
      const sfxAudio = new Audio('audio/sfx/' + cue.file);
      sfxAudio.volume = Math.max(0, Math.min(1, cue.volume || 0.5));
      if (!cue.offset || cue.offset <= 0.05) {
        sfxAudio.play().catch(()=>{});
      } else {
        setTimeout(() => {
          if (idx === n && !jeda) sfxAudio.play().catch(()=>{});
        }, cue.offset * 1000);
      }
    });
  }
}

/* renderAt(t): satu-satunya sumber kebenaran posisi waktu.
   Dipakai playback interaktif DAN renderer MP4 (frame per frame),
   sehingga hasil ekspor identik dengan yang terlihat di layar. */
function renderAt(t) {
  let n = 0;
  for (let i = META.length - 1; i >= 0; i--) if (t >= META[i].start) { n = i; break; }
  if (n !== idx) keScene(n, false);

  const m = META[n];
  const st = Math.max(0, t - m.start);
  const p  = Math.min(1, st / m.dur);

  const aktif = (m.chunks||[]).filter(c => st >= c.start - 0.05);
  tulisSub((aktif.length ? aktif[aktif.length-1] : (m.chunks||[])[0])?.text || '', m.sorot);

  const svg = scEls[n].querySelector('svg');
  if (svg) {
    svg.style.animationPlayState = 'paused';
    svg.style.animationDelay = (-st) + 's'; // only renderAt owns camera time
  }

  const fn = MOTION[n];
  if (fn) {
    try {
      fn(st, p, m.dur, id => scEls[n].querySelector('#' + CSS.escape(id)),
         Math.sin(st*2.2), Math.cos(st*2.2), Math.sin(st*1.8),
         Math.sin(st*8), Math.sin(st*35), mulus, fisika);
    } catch (e) { /* satu scene bermasalah tidak boleh menghentikan film */ }
  }
}
window.renderAt = renderAt;
window.TOTAL_DURASI = TOTAL;

// Studio opens the selected scene silently; no implicit jump to scene one.
window.studioPreview = function(n) {
  if (!META.length) return;
  n = Math.max(0, Math.min(META.length - 1, Math.trunc(Number(n) || 0)));
  audioEl?.pause();
  sceneLoopEl?.pause();
  bgmAudioEl?.pause();
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  jeda = true;
  sudahMulai = false;
  document.body.classList.add('studio-mode');
  const mEl = $('#mulai');
  if (mEl) mEl.classList.add('off');
  keScene(n, false);
  renderAt(META[n].start);
};

function tick() {
  requestAnimationFrame(tick);
  if (jeda || idx < 0 || MODE === 'render') return;
  const st = (performance.now() - mulaiScene) / 1000;
  const m = META[idx];
  if (st >= m.dur) {
    if (idx + 1 < META.length) keScene(idx + 1);
    else { jeda = true; subEl.innerHTML=''; }
    return;
  }
  renderAt(m.start + st);
}
requestAnimationFrame(tick);

function mulai() {
  if (sudahMulai) return;
  sudahMulai = true;
  $('#mulai')?.classList.add('off');
  jeda = false;
  keScene(idx < 0 ? 0 : idx);
}
addEventListener('pointerdown', mulai);

addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    if (!sudahMulai) return mulai();
    jeda = !jeda;
    if (jeda) { audioEl?.pause(); sceneLoopEl?.pause(); bgmAudioEl?.pause(); speechSynthesis?.cancel?.(); }
    else { bgmAudioEl?.play().catch(()=>{}); mulaiScene = performance.now(); keScene(idx); }
  }
  else if (e.code === 'ArrowRight') { jeda=false; keScene(idx+1); }
  else if (e.code === 'ArrowLeft')  { jeda=false; keScene(idx-1); }
  else if (e.code === 'KeyR')       { jeda=false; keScene(0); }
});

/* Dipakai renderer: tanda bahwa halaman siap digambar frame-per-frame. */
window.SIAP_RENDER = true;
const initParams = new URLSearchParams(location.search);
if (MODE === 'render') {
  document.body.classList.add('studio-mode');
  $('#mulai')?.classList.add('off');
  renderAt(0);
} else if (initParams.has('scene')) {
  document.body.classList.add('studio-mode');
  $('#mulai')?.classList.add('off');
  window.studioPreview(initParams.get('scene'));
}
</script>

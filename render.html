<style>
:root { --sub-h: 150px; }
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; background:#05070D; overflow:hidden;
  font-family:'Bricolage Grotesque',system-ui,sans-serif; }

#stage { position:absolute; top:50%; left:50%; width:1920px; height:1080px;
  transform:translate(-50%,-50%); transform-origin:center center;
  overflow:hidden; background:#05070D; }

/* --- scene ------------------------------------------------------------ */
.sc { position:absolute; inset:0; opacity:0; visibility:hidden;
  will-change:opacity,transform; }
.sc svg { width:100%; height:100%; display:block; }
.sc.aktif { opacity:1; visibility:visible; }
/* Gerak kamera dijalankan CSS (compositor thread) supaya tetap mulus
   walau thread JS sibuk menggambar isi scene. */
.sc.aktif svg { animation:var(--cam) var(--dur) linear 1 forwards;
  transform-origin:center center; }

/* Tint per babak: menyatukan warna antar-scene supaya tidak meloncat. */
.sc::after { content:''; position:absolute; inset:0; pointer-events:none;
  background:var(--grade); mix-blend-mode:soft-light; }

/* --- lapis suasana global -------------------------------------------- */
/* Semua lapis ini statis (tanpa filter blur real-time) — pelajaran dari
   percobaan sebelumnya: blur pada banyak layer besar membekukan browser. */
#vignette { position:absolute; inset:0; pointer-events:none; z-index:20;
  background:
    radial-gradient(ellipse 78% 68% at 50% 46%, transparent 42%, rgba(0,0,0,.55) 100%),
    linear-gradient(to bottom, rgba(0,0,0,.30) 0%, transparent 18%, transparent 76%, rgba(0,0,0,.48) 100%);
}
#haze { position:absolute; inset:0; pointer-events:none; z-index:19;
  background:linear-gradient(to bottom,
    transparent 0%, rgba(148,176,214,.055) 38%, rgba(148,176,214,.085) 54%, transparent 72%);
}
/* Grain: satu SVG noise di-tile. Memberi rasa "kertas kolase" dan
   menyamarkan banding pada gradient besar. */
#grain { position:absolute; inset:0; pointer-events:none; z-index:21;
  opacity:.055; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.6'/></svg>");
  background-size:340px 340px; }

/* Flash cut: penanda benturan/kejutan, dipicu dari JS. */
#flash { position:absolute; inset:0; pointer-events:none; z-index:30;
  background:#fff; opacity:0; }
#flash.tembak { animation:flashOut .28s ease-out 1; }
@keyframes flashOut { from { opacity:.82; } to { opacity:0; } }


@keyframes camPush     { from { transform: scale(1.00) translate(0,0); }      to { transform: scale(1.14) translate(0,-1.5%); } }
@keyframes camPullback { from { transform: scale(1.16) translate(0,1%); }     to { transform: scale(1.00) translate(0,0); } }
@keyframes camPanRight { from { transform: scale(1.10) translate(3.5%,0); }   to { transform: scale(1.10) translate(-3.5%,0); } }
@keyframes camPanLeft  { from { transform: scale(1.10) translate(-3.5%,0); }  to { transform: scale(1.10) translate(3.5%,0); } }
@keyframes camCrane    { from { transform: scale(1.14) translate(0,-4%); }    to { transform: scale(1.04) translate(0,1.5%); } }
@keyframes camDutch    { from { transform: scale(1.10) rotate(-1.6deg); }     to { transform: scale(1.14) rotate(1.6deg); } }


/* --- subtitle --------------------------------------------------------- */
#sub { position:absolute; left:50%; bottom:28px; transform:translateX(-50%);
  width:1560px; max-width:1560px; z-index:25; text-align:center;
  padding:14px 34px; border-radius:14px;
  background:rgba(8,14,26,.90); border:1.2px solid rgba(255,255,255,.18);
  box-shadow:0 12px 40px rgba(0,0,0,.5);
  font-size:30px; line-height:1.34; font-weight:800; color:#F8FAFC;
  text-wrap:balance; }
#sub:empty { display:none; }
#sub .hl { display:inline-block; padding:2px 14px; margin:0 4px;
  border-radius:7px; font-weight:900; color:#FFF;
  background:linear-gradient(135deg, #EA580C 0%, #F97316 100%);
  box-shadow:0 2px 12px rgba(234,88,12,.5), inset 0 1px 0 rgba(255,255,255,.15);
  text-shadow:0 1px 3px rgba(0,0,0,.4); }

#mulai { position:absolute; inset:0; z-index:60; display:flex;
  align-items:center; justify-content:center; background:rgba(5,7,13,.92);
  color:#F8FAFC; font-size:26px; font-weight:800; cursor:pointer;
  letter-spacing:.3px; }
#mulai.off { display:none; }
body.studio-mode #mulai { display:none !important; }
</style></head>

<div id="stage">

  <style>
    @keyframes rekahanKiriAksi {
      0% { transform: translate(0px, 0px); }

      18% { transform: translate(-30px, 4px); }
      100% { transform: translate(-30px, 4px); }

      0% { transform: translate(0px, 0px); }
      12% { transform: translate(46px, -6px); }
      18% { transform: translate(40px, -4px); }
      100% { transform: translate(40px, -4px); }
    }
    @keyframes getarBumi {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-1.5px, 2px); }
      40% { transform: translate(2px, -1px); }
      60% { transform: translate(-2px, -1.5px); }
      80% { transform: translate(1.5px, 1.5px); }
    }
    @keyframes pendarMagmaInti {
      0%, 100% { opacity: 0.92; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.02); }
    }
    @keyframes uapMembumbung {
      0% { transform: translate(0px, 0px) scale(0.95); opacity: 0; }
      25% { opacity: 0.8; }
      80% { opacity: 0.6; }
      100% { transform: translate(-45px, -90px) scale(1.15); opacity: 0; }
    }
    @keyframes percikanLontar {
      0% { transform: translate(0, 0) scale(0.6); opacity: 0; }
      20% { opacity: 1; }
      80% { transform: translate(var(--dx, 20px), var(--dy, -60px)) scale(1.1); opacity: 0.9; }
      100% { transform: translate(calc(var(--dx, 20px) * 1.3), calc(var(--dy, -60px) + 35px)) scale(0.7); opacity: 0; }
    }

    #lembahKiri { animation: rekahanKiriAksi 7s cubic-bezier(0.1, 0.9, 0.2, 1) forwards; transform-origin: 200px 1080px; }
    #lembahKanan { animation: rekahanKananAksi 7s cubic-bezier(0.1, 0.9, 0.2, 1) forwards; transform-origin: 1700px 1080px; }
    .getarMikro { animation: getarBumi 0.14s linear infinite; }
    .denyutMagma { animation: pendarMagmaInti 2.4s ease-in-out infinite; transform-origin: 1060px 880px; }
    .uapSiklus1 { animation: uapMembumbung 4s ease-out infinite; transform-origin: center; }
    .uapSiklus2 { animation: uapMembumbung 4.6s ease-out infinite 1.8s; transform-origin: center; }
    .percikan1 { --dx: -40px; --dy: -95px; animation: percikanLontar 1.8s ease-out infinite 0.2s; }
    .percikan2 { --dx: 35px; --dy: -120px; animation: percikanLontar 2.1s ease-out infinite 0.7s; }
    .percikan3 { --dx: 65px; --dy: -75px; animation: percikanLontar 1.6s ease-out infinite 1.2s; }
  </style>
</defs>

const $ = s => document.querySelector(s);

const mulus = x => x*x*(3-2*x);

/* =========================================================================
   2D PHYSICS & RIGGING TOOLKIT (Fisika Panggung)
   ========================================================================= */
const fisika = {
  // 1. Spring Physics (Framer Motion / React Spring style)
  pegas(t, freq = 3.2, redaman = 0.72) {
    if (t <= 0) return 0;
    const w = freq * Math.PI * 2;
    const decay = Math.exp(-redaman * w * t);
    const wDamped = w * Math.sqrt(Math.max(0, 1 - redaman * redaman));
    return 1 - decay * Math.cos(wDamped * t);
  },

  // 2. Inersia langkah kaki & ayunan tubuh alami
  langkah(t, speed = 6.0, bobot = 4.5) {
    const s = Math.sin(t * speed);
    return {
      ayun: s,
      hentak: -Math.abs(s) * bobot,
    };
  },

  // 3. Rigid-body Surface Contact (Anti-melayang & Anti-tembus lantai)
  tumpu(yObj, yLantai = 850) {
    return Math.min(yObj, yLantai);
  },

  // 4. Rigging Constraint (Kunci anak ke koordinat induk: anti tangan copot/koper lepas)
  ikat(anakEl, xInduk, yInduk, offsetX = 0, offsetY = 0, rotasi = 0, cx = 0, cy = 0) {
    if (!anakEl) return;
    const x = Number(xInduk || 0) + Number(offsetX || 0);
    const y = Number(yInduk || 0) + Number(offsetY || 0);
    const r = rotasi ? ((cx || cy) ? ` rotate(${rotasi} ${cx} ${cy})` : ` rotate(${rotasi})`) : '';
    anakEl.setAttribute('transform', `translate(${x.toFixed(1)}, ${y.toFixed(1)})${r}`);
  },

  // 5. In-Place Rotation (Anti mengorbit liar)
  putar(el, deg, cx, cy) {
    if (!el) return;
    el.setAttribute('transform', `rotate(${Number(deg).toFixed(1)} ${cx} ${cy})`);
  },

  // 6. Rolling Without Slipping (Roda menggelinding presisi)
  gelinding(dx, radius = 40) {
    return (dx / (radius * 2 * Math.PI)) * 360;
  }
};
window.fisika = fisika;

/* Subtitle disorot dengan mencocokkan kata kunci dari storyboard.
   Kalau frasa utuh tidak persis sama, cari kata kunci terpanjangnya. */
function tulisSub(teks, sorot) {
  if (!teks) { subEl.innerHTML = ''; return; }
  let html = teks.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const kunci = (sorot||'').trim();
  if (kunci) {
    const re = new RegExp('(' + kunci.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'i');
    if (re.test(html)) {
      html = html.replace(re, '<span class="hl">$1</span>');
    } else {
      const kata2 = kunci.split(/\s+/).filter(w => w.length >= 4);
      for (const w of kata2) {
        const rew = new RegExp('\\b(' + w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')\\b', 'i');
        if (rew.test(html)) {
          html = html.replace(rew, '<span class="hl">$1</span>');
          break;
        }
      }
    }
  }
  subEl.innerHTML = html;
}

function keScene(n, mainkanAudio = true) {
  if (n < 0) n = 0;
  if (n >= scEls.length) n = scEls.length - 1;
  const lama = idx; idx = n; mulaiScene = performance.now();

  scEls.forEach((e,i) => {
    if (i === n) {
      e.style.setProperty('--cam', 'none'); void e.offsetWidth;   // reset animasi kamera
      e.style.setProperty('--cam', e.dataset.cam);
      e.classList.add('aktif');
    } else e.classList.remove('aktif');
  });

  const m = META[n];
  tulisSub(m.chunks?.[0]?.text || '', m.sorot);
  if (lama !== -1 && (n - lama === 1)) flash();

  if (!mainkanAudio) return;
  if (MODE === 'render') return;            // saat render, audio digabung ffmpeg

  putarBgm();

  if (m.audio) {                            // mp3 hasil edge-tts
    if (audioEl) { audioEl.pause(); audioEl.src=''; }
    audioEl = new Audio('audio/' + m.audio);
    audioEl.play().catch(()=>{});
  } else if ('speechSynthesis' in window) {  // preview cepat tanpa file
    speechSynthesis.cancel();
    const kalimat = (m.chunks||[]).map(c=>c.text).join(' ').replace(/[.!?]+$/,'');
    if (kalimat) {
      const u = new SpeechSynthesisUtterance(kalimat);
      u.lang='id-ID'; u.rate=1.12; u.pitch=0.92;
      const v = speechSynthesis.getVoices().find(v=>/^id/i.test(v.lang));
      if (v) u.voice = v;
      speechSynthesis.speak(u);
    }
  }

  // Layer Continuous Scene Ambient Loop (Durasi Penuh Scene)
  if (sceneLoopEl) { sceneLoopEl.pause(); sceneLoopEl = null; }
  if (m.loop && m.loop.file) {
    sceneLoopEl = new Audio('audio/sfx/' + m.loop.file);
    sceneLoopEl.loop = true;
    sceneLoopEl.volume = Math.max(0, Math.min(1, m.loop.volume || 0.20));
    sceneLoopEl.play().catch(()=>{});
  }

  // Layer SFX Foley & Transisi Panggung (3-Layer Action Stacks)
  if (m.sfx && Array.isArray(m.sfx)) {
    m.sfx.forEach(cue => {
      const sfxAudio = new Audio('audio/sfx/' + cue.file);
      sfxAudio.volume = Math.max(0, Math.min(1, cue.volume || 0.5));
      if (!cue.offset || cue.offset <= 0.05) {
        sfxAudio.play().catch(()=>{});
      } else {
        setTimeout(() => {
          if (idx === n && !jeda) sfxAudio.play().catch(()=>{});
        }, cue.offset * 1000);
      }
    });
  }
}

/* renderAt(t): satu-satunya sumber kebenaran posisi waktu.
   Dipakai playback interaktif DAN renderer MP4 (frame per frame),
   sehingga hasil ekspor identik dengan yang terlihat di layar. */
function renderAt(t) {
  let n = 0;
  for (let i = META.length - 1; i >= 0; i--) if (t >= META[i].start) { n = i; break; }
  if (n !== idx) keScene(n, false);

  const m = META[n];
  const st = Math.max(0, t - m.start);
  const p  = Math.min(1, st / m.dur);

  const aktif = (m.chunks||[]).filter(c => st >= c.start - 0.05);
  tulisSub((aktif.length ? aktif[aktif.length-1] : (m.chunks||[])[0])?.text || '', m.sorot);

  const svg = scEls[n].querySelector('svg');
  if (svg) {
    svg.style.animationPlayState = 'paused';
    svg.style.animationDelay = (-st) + 's'; // only renderAt owns camera time
  }

  const fn = MOTION[n];
  if (fn) {
    try {
      fn(st, p, m.dur, id => scEls[n].querySelector('#' + CSS.escape(id)),
         Math.sin(st*2.2), Math.cos(st*2.2), Math.sin(st*1.8),
         Math.sin(st*8), Math.sin(st*35), mulus, fisika);
    } catch (e) { /* satu scene bermasalah tidak boleh menghentikan film */ }
  }
}
window.renderAt = renderAt;
window.TOTAL_DURASI = TOTAL;

// Studio opens the selected scene silently; no implicit jump to scene one.
window.studioPreview = function(n) {
  if (!META.length) return;
  n = Math.max(0, Math.min(META.length - 1, Math.trunc(Number(n) || 0)));
  audioEl?.pause();
  sceneLoopEl?.pause();
  bgmAudioEl?.pause();
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  jeda = true;
  sudahMulai = false;
  document.body.classList.add('studio-mode');
  const mEl = $('#mulai');
  if (mEl) mEl.classList.add('off');
  keScene(n, false);
  renderAt(META[n].start);
};

function tick() {
  requestAnimationFrame(tick);
  if (jeda || idx < 0 || MODE === 'render') return;
  const st = (performance.now() - mulaiScene) / 1000;
  const m = META[idx];
  if (st >= m.dur) {
    if (idx + 1 < META.length) keScene(idx + 1);
    else { jeda = true; subEl.innerHTML=''; }
    return;
  }
  renderAt(m.start + st);
}
requestAnimationFrame(tick);

function mulai() {
  if (sudahMulai) return;
  sudahMulai = true;
  $('#mulai')?.classList.add('off');
  jeda = false;
  keScene(idx < 0 ? 0 : idx);
}
addEventListener('pointerdown', mulai);

addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    if (!sudahMulai) return mulai();
    jeda = !jeda;
    if (jeda) { audioEl?.pause(); sceneLoopEl?.pause(); bgmAudioEl?.pause(); speechSynthesis?.cancel?.(); }
    else { bgmAudioEl?.play().catch(()=>{}); mulaiScene = performance.now(); keScene(idx); }
  }
  else if (e.code === 'ArrowRight') { jeda=false; keScene(idx+1); }
  else if (e.code === 'ArrowLeft')  { jeda=false; keScene(idx-1); }
  else if (e.code === 'KeyR')       { jeda=false; keScene(0); }
});

/* Dipakai renderer: tanda bahwa halaman siap digambar frame-per-frame. */
window.SIAP_RENDER = true;
const initParams = new URLSearchParams(location.search);
if (MODE === 'render') {
  document.body.classList.add('studio-mode');
  $('#mulai')?.classList.add('off');
  renderAt(0);
} else if (initParams.has('scene')) {
  document.body.classList.add('studio-mode');
  $('#mulai')?.classList.add('off');
  window.studioPreview(initParams.get('scene'));
}
</script>

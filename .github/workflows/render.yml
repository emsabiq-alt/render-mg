name: Render Explainer Video (Matrix Parallel)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  render-chunks:
    name: Render Scenes ${{ matrix.start }}-${{ matrix.end }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - chunk: 1
            start: 1
            end: 10
          - chunk: 2
            start: 11
            end: 20
          - chunk: 3
            start: 21
            end: 30
          - chunk: 4
            start: 31
            end: 40
          - chunk: 5
            start: 41
            end: 50

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-noto-cjk libnss3 libatk-bridge2.0-0 libgtk-3-0
          sudo apt-get install -y google-chrome-stable || true

      - name: Install Python Dependencies
        run: |
          pip install websocket-client

      - name: Run Chunk Render
        run: |
          python render.py \
            --audio-dir audio \
            --start-scene ${{ matrix.start }} \
            --end-scene ${{ matrix.end }} \
            --out chunks/chunk_${{ matrix.chunk }}.mp4 \
            --fps 30

      - name: Upload Chunk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-chunk-${{ matrix.chunk }}
          path: chunks/chunk_${{ matrix.chunk }}.mp4
          retention-days: 3

  merge-video:
    name: Merge Full Video & Publish Artifact
    needs: render-chunks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download All Chunks
        uses: actions/download-artifact@v4
        with:
          path: downloaded-chunks

      - name: Stitch Video Chunks & Master Audio Mix
        run: |
          mkdir -p final_output
          find downloaded-chunks -name "chunk_*.mp4" | sort -V | while read f; do echo "file '$PWD/$f'"; done > list.txt
          cat list.txt
          if [ -f "audio/master_audio.m4a" ]; then
            echo "Found audio/master_audio.m4a! Merging video with master audio track (VO + BGM + SFX)..."
            ffmpeg -y -f concat -safe 0 -i list.txt -i audio/master_audio.m4a -map 0:v -map 1:a -c:v copy -c:a aac -b:a 192k -shortest final_output/rendered_video_final.mp4
          else
            echo "No master_audio.m4a found, concatenating video chunks as is..."
            ffmpeg -y -f concat -safe 0 -i list.txt -c copy final_output/rendered_video_final.mp4
          fi
          ls -lh final_output

      - name: Upload Final Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: explainer-video-final
          path: final_output/rendered_video_final.mp4
          retention-days: 14
